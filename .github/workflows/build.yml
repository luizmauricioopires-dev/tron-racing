name: Compilar IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto Xcode
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -project TronRacing.xcodeproj \
            -target TronRacing \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*Swift|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
          test -d build/Release-iphoneos/TronRacing.app/PlugIns/TronRacingBroadcast.appex

      - name: Empacotar o IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/TronRacing.app Payload/
          ls Payload/TronRacing.app/PlugIns
          zip -qry TronRacing.ipa Payload

      - name: Publicar em Releases (link fixo para baixar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima TronRacing.ipa --title "Tron Racing (última compilação)" \
            --notes "Compilado de ${GITHUB_SHA::7}. Baixe o TronRacing.ipa e assine no 3uTools ou Sideloadly." --latest

      - uses: actions/upload-artifact@v4
        with:
          name: TronRacing-ipa
          path: TronRacing.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-da-compilacao
          path: build.log
