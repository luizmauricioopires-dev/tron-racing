name: Compilar IPA

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      need: ${{ steps.c.outputs.need }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pub=$(gh release view ultima -R "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$pub" = "$GITHUB_SHA" ]; then echo need=no >> $GITHUB_OUTPUT; else echo need=yes >> $GITHUB_OUTPUT; fi

  build:
    needs: check
    if: needs.check.outputs.need == 'yes'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache do OpenH264
        id: oh264
        uses: actions/cache@v4
        with:
          path: Vendor/openh264
          key: openh264-v2.4.1-ios16-arm64-${{ matrix.os }}

      - name: Compilar OpenH264 (codificador para o iPhone bloqueado)
        if: steps.oh264.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b v2.4.1 https://github.com/cisco/openh264 /tmp/openh264
          cd /tmp/openh264
          sed -i '' 's/-fembed-bitcode//' build/platform-ios.mk
          make OS=ios ARCH=arm64 SDK_MIN=16.0 libopenh264.a -j4 > /tmp/oh264.log 2>&1 || (tail -40 /tmp/oh264.log; exit 1)
          mkdir -p "$GITHUB_WORKSPACE/Vendor/openh264/lib" "$GITHUB_WORKSPACE/Vendor/openh264/include/wels"
          cp libopenh264.a "$GITHUB_WORKSPACE/Vendor/openh264/lib/"
          cp codec/api/wels/*.h "$GITHUB_WORKSPACE/Vendor/openh264/include/wels/"
          ls -la "$GITHUB_WORKSPACE/Vendor/openh264/lib"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto Xcode
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -project TronRacing.xcodeproj \
            -target TronRacing \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
          test -d build/Release-iphoneos/TronRacing.app/PlugIns/TronRacingBroadcast.appex

      - name: Empacotar o IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/TronRacing.app Payload/
          ls Payload/TronRacing.app/PlugIns
          zip -qry TronRacing.ipa Payload

      - name: Publicar em Releases (link fixo para baixar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ultima --json targetCommitish -q .targetCommitish | grep -q "$GITHUB_SHA"; then echo "ja publicado por outro Mac"; exit 0; fi
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima TronRacing.ipa --target "$GITHUB_SHA" --title "Tron Racing (última compilação)" \
            --notes "Compilado de ${GITHUB_SHA::7}. Baixe o TronRacing.ipa e assine no 3uTools ou Sideloadly." --latest

      - uses: actions/upload-artifact@v4
        with:
          name: TronRacing-ipa-${{ matrix.os }}
          path: TronRacing.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-da-compilacao-${{ matrix.os }}
          path: build.log
